# ================================
# SERVER CONFIGURATION
# ================================
server.port=8080
spring.application.name=booking-service
server.shutdown=graceful

# ================================
# MONGODB CONFIGURATION
# Shared with Node.js Application
# ================================
spring.data.mongodb.uri=mongodb://localhost:27017/airbnb?replicaSet=rs0
spring.data.mongodb.database=airbnb

# For MongoDB Atlas (uncomment if needed):
# spring.data.mongodb.uri=***REMOVED***/airbnb?retryWrites=true&w=majority

# ================================
# VIRTUAL THREADS (Java 21)
# ================================
spring.threads.virtual.enabled=true

# ================================
# LOGGING CONFIGURATION
# ================================
logging.level.com.airbnb.booking=DEBUG
logging.level.org.springframework.data.mongodb=INFO
logging.level.org.springframework.web=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss} - %msg%n

# ================================
# CORS CONFIGURATION
# Allow Node.js app to call this service
# ================================
cors.allowed-origins=http://localhost:5000,http://localhost:3000

# ================================
# JSON CONFIGURATION
# ================================
spring.jackson.date-format=yyyy-MM-dd'T'HH:mm:ss.SSS'Z'
spring.jackson.time-zone=UTC
spring.jackson.serialization.write-dates-as-timestamps=false

# ================================
# ACTUATOR (Monitoring)
# ================================
management.endpoints.web.exposure.include=health,info,metrics
management.endpoint.health.show-details=always

# ================================
# PERFORMANCE TUNING
# ================================
server.tomcat.threads.max=200
server.tomcat.threads.min-spare=10
# ================================
# STRANGLER FIG MIGRATION PHASE
# ================================
migration.phase=PHASE_3_CUTOVER
