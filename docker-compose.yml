# ═══════════════════════════════════════════════════════════════
# HouseRental — Docker Compose
#
# Services:
#   mongo          — Shared MongoDB instance (replica set enabled)
#   booking-service — Java Spring Boot microservice (port 8080)
#   app             — Node.js Express frontend (port 5000)
#
# Usage:
#   docker-compose up -d          # start all services
#   docker-compose logs -f app    # tail Node.js logs
#   docker-compose down -v        # stop and remove volumes
# ═══════════════════════════════════════════════════════════════

services:

  # ─────────────────────────────────────────────────────────────
  # MongoDB
  # Both services share this instance (Strangler Fig Phase 3)
  # ─────────────────────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: houserental-mongo
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: airbnb
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - houserental-net

  # ─────────────────────────────────────────────────────────────
  # Java Booking Microservice
  # ─────────────────────────────────────────────────────────────
  booking-service:
    build:
      context: ./booking-service
      dockerfile: Dockerfile
    container_name: houserental-booking
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      SPRING_DATA_MONGODB_URI: mongodb://mongo:27017/airbnb
      SPRING_DATA_MONGODB_DATABASE: airbnb
      SPRING_THREADS_VIRTUAL_ENABLED: "true"
      CORS_ALLOWED_ORIGINS: http://localhost:5000,http://app:5000
      MIGRATION_PHASE: PHASE_3_CUTOVER
      MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,info,metrics
      MANAGEMENT_ENDPOINT_HEALTH_SHOW_DETAILS: always
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/actuator/health | grep -q UP"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 40s
    networks:
      - houserental-net

  # ─────────────────────────────────────────────────────────────
  # Node.js Frontend
  # ─────────────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: houserental-app
    restart: unless-stopped
    ports:
      - "5000:5000"
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGODB_URI: mongodb://mongo:27017/airbnb
      SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
      BOOKING_SERVICE_URL: http://booking-service:8080/api/bookings
    depends_on:
      mongo:
        condition: service_healthy
      booking-service:
        condition: service_healthy
    networks:
      - houserental-net

# ─────────────────────────────────────────────────────────────
# Shared network — services resolve each other by name
# (e.g. Node.js calls http://booking-service:8080)
# ─────────────────────────────────────────────────────────────
networks:
  houserental-net:
    driver: bridge

# ─────────────────────────────────────────────────────────────
# Named volume for persistent MongoDB data
# ─────────────────────────────────────────────────────────────
volumes:
  mongo-data: